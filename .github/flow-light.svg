<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-label="Mandate flow: the agent Sprite sends signed calls to the Warden Sprite, which verifies, classifies, authorizes and logs them, then forwards allowed calls to the GitHub and Ollama connectors and checkpoints or restores the agent through the Sprites API.">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B3BE2"/></marker>
