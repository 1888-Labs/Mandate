  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#DCD3F5" opacity=".55"/></pattern>
</defs>
<rect width="1000" height="550" rx="20" fill="#FFFFFF"/><rect width="1000" height="550" rx="20" fill="url(#dots)"/>
